# Test and Code Quality Workflow
# CI/CD Status Badges (add to README.md):
# [![Tests](https://github.com/is42day/binance-trading-agent/actions/workflows/test.yml/badge.svg)](https://github.com/is42day/binance-trading-agent/actions/workflows/test.yml)
# [![codecov](https://codecov.io/gh/is42day/binance-trading-agent/branch/main/graph/badge.svg)](https://codecov.io/gh/is42day/binance-trading-agent)

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # DB_PATH, not DATABASE_URL: DATABASE_URL pins every PortfolioManager to
  # one shared SQLite file for the whole pytest session (cross-test
  # UNIQUE-constraint collisions); DB_PATH lets each test that constructs
  # its own PortfolioManager(db_path=...) reset the engine to an isolated
  # file. A prior unquoted "sqlite:///:memory:" DATABASE_URL also broke the
  # YAML parser outright (trailing ":" with nothing after it), so this
  # workflow never ran at all; and :memory: is broken separately at the SQL
  # level since this repo's engine uses NullPool for SQLite, which opens a
  # fresh connection per checkout — wiping an in-memory DB between them.
  # (The separate "integration" job below sets its own DATABASE_URL against
  # real Postgres at the step level, which still takes precedence there.)
  DB_PATH: /tmp/ci_test_portfolio.db
  # Demo mode returns synthetic market data instead of calling the real
  # Binance API with the dummy credentials below — required for
  # BinanceAPIClient-touching tests to behave deterministically in CI.
  DEMO_MODE: "true"
  BINANCE_API_URL: https://testnet.binance.vision
  BINANCE_API_KEY: dummy_key_for_ci
  BINANCE_API_SECRET: dummy_secret_for_ci
  LOG_LEVEL: WARNING
  PYTHONPATH: /home/runner/work/binance-trading-agent/binance-trading-agent
  # require_api_token defaults to enforcing auth (fail-closed) so a bare
  # `uvicorn` run outside docker-compose isn't silently wide open. Tests
  # hit the API directly without configuring a token, so opt out explicitly
  # here rather than relying on the (now secure-by-default) code default.
  API_AUTH_REQUIRED: "false"

permissions:
  contents: read

jobs:
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-
            ${{ runner.os }}-pip-

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy types-redis types-requests

      - name: Install package in editable mode
        run: pip install -e .

      - name: Check code formatting with black
        run: black --check binance_trade_agent tests

      - name: Lint with ruff
        run: ruff check binance_trade_agent tests

      - name: Type check with mypy
        run: mypy binance_trade_agent
        continue-on-error: true

  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Install package in editable mode
        run: pip install -e .

      - name: Create test database directory
        run: mkdir -p data logs

      - name: Run unit tests with coverage
        run: |
          pytest binance_trade_agent/tests/ tests/ \
            --cov=binance_trade_agent \
            --cov-report=xml \
            --cov-report=term \
            -v \
            --tb=short \
            -m "not integration" \
            --ignore=binance_trade_agent/tests/test_api_endpoints.py \
            --ignore=binance_trade_agent/tests/test_dashboard_integration.py

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-py${{ matrix.python-version }}
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            coverage.xml
            .coverage
          retention-days: 7

  integration:
    name: Integration Tests (Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: binance_trading
          POSTGRES_USER: trading_user
          POSTGRES_PASSWORD: trading_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U trading_user -d binance_trading"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Install package in editable mode
        run: pip install -e .

      - name: Create directories
        run: mkdir -p data logs

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+psycopg2://trading_user:trading_pass@localhost:5432/binance_trading
        run: alembic upgrade head

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql+psycopg2://trading_user:trading_pass@localhost:5432/binance_trading
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          BINANCE_API_KEY: dummy_key_for_ci
          BINANCE_API_SECRET: dummy_secret_for_ci
          BINANCE_API_URL: https://testnet.binance.vision
          LOG_LEVEL: WARNING
        run: |
          pytest binance_trade_agent/tests/test_api_endpoints.py \
            binance_trade_agent/tests/test_dashboard_integration.py \
            -v \
            --tb=short

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run security audit
        run: pip-audit -r requirements.txt
        continue-on-error: true
