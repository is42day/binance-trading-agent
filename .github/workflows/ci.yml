name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Use in-memory SQLite for CI (no Postgres needed for unit tests)
  DATABASE_URL: sqlite:///:memory:
  BINANCE_API_KEY: dummy_key_for_ci
  BINANCE_API_SECRET: dummy_secret_for_ci
  BINANCE_API_URL: https://testnet.binance.vision
  LOG_LEVEL: WARNING

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black isort pip-audit pytest pytest-asyncio

      - name: Install package in editable mode
        run: pip install -e .

      - name: Create test directories
        run: mkdir -p data logs

      - name: Lint with ruff
        run: ruff check binance_trade_agent tests

      - name: Format check with black
        run: black --check binance_trade_agent tests

      - name: Import sort check with isort
        run: isort --check-only binance_trade_agent tests

      - name: Run unit tests
        run: |
          pytest binance_trade_agent/tests/ \
            --disable-warnings \
            -v \
            --tb=short \
            -m "not integration" \
            --ignore=binance_trade_agent/tests/test_api_endpoints.py \
            --ignore=binance_trade_agent/tests/test_dashboard_integration.py

      - name: Security audit
        run: pip-audit
