name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # DB_PATH, not DATABASE_URL: DATABASE_URL pins every PortfolioManager to
  # one shared SQLite file for the whole pytest session (cross-test
  # UNIQUE-constraint collisions); DB_PATH lets each test that constructs
  # its own PortfolioManager(db_path=...) reset the engine to an isolated
  # file. A prior "sqlite:///:memory:" DATABASE_URL was also broken at the
  # SQL level — this repo's engine uses NullPool for SQLite, which opens a
  # fresh connection per checkout, and an in-memory DB is wiped between
  # connections.
  DB_PATH: /tmp/ci_test_portfolio.db
  # Demo mode returns synthetic market data instead of calling the real
  # Binance API with the dummy credentials below — required for
  # BinanceAPIClient-touching tests to behave deterministically in CI.
  DEMO_MODE: "true"
  BINANCE_API_KEY: dummy_key_for_ci
  BINANCE_API_SECRET: dummy_secret_for_ci
  BINANCE_API_URL: https://testnet.binance.vision
  LOG_LEVEL: WARNING

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black isort pip-audit pytest pytest-asyncio

      - name: Install package in editable mode
        run: pip install -e .

      - name: Create test directories
        run: mkdir -p data logs

      - name: Lint with ruff
        run: ruff check binance_trade_agent tests

      - name: Format check with black
        run: black --check binance_trade_agent tests

      - name: Import sort check with isort
        run: isort --check-only binance_trade_agent tests

      - name: Run unit tests
        run: |
          pytest binance_trade_agent/tests/ tests/ \
            --disable-warnings \
            -v \
            --tb=short \
            -m "not integration" \
            --ignore=binance_trade_agent/tests/test_api_endpoints.py \
            --ignore=binance_trade_agent/tests/test_dashboard_integration.py

      - name: Security audit
        run: pip-audit
        continue-on-error: true
