x-service-logging: &service-logging
  driver: "json-file"
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILES:-5}"

services:
  # PostgreSQL database for production-grade multi-writer support
  postgres:
    image: postgres:16-alpine
    container_name: binance-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-binance_trading}
      - POSTGRES_USER=${POSTGRES_USER:-trading_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - PGDATA=/var/lib/postgresql/data/pgdata
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - trading-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading_user} -d ${POSTGRES_DB:-binance_trading}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *service-logging

  # One-shot migration service: runs alembic upgrade head and exits
  # Other services depend on this to ensure schema is present before they start
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: binance-migrate
    entrypoint: /bin/sh
    command: >
      -c "echo '[MIGRATE] Waiting for PostgreSQL...' &&
      nc -z postgres 5432 || (echo 'PostgreSQL not ready'; exit 1) &&
      echo '[MIGRATE] PostgreSQL is ready. Running migrations...' &&
      alembic upgrade head &&
      echo '[MIGRATE] Schema migration completed successfully'"
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-trading_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-binance_trading}
      - PYTHONPATH=/app
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - trading-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"  # One-shot: don't restart on exit
    logging: *service-logging

  # FastAPI service: data access, trading operations API
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: binance-api
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "python -m binance_trade_agent.scripts.preflight --service api &&
      uvicorn binance_trade_agent.api.api:app --host 0.0.0.0 --port 8000"
    environment:
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET:-}
      - BINANCE_API_URL=${BINANCE_API_URL:-https://testnet.binance.vision}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-trading_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-binance_trading}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-10}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-30}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - API_AUTH_REQUIRED=${API_AUTH_REQUIRED:-true}
      - API_AUTH_TOKEN=${API_AUTH_TOKEN:?Set API_AUTH_TOKEN in .env}
      - API_CORS_ORIGINS=${API_CORS_ORIGINS:-http://localhost:8050,http://127.0.0.1:8050}
      - RISK_SHARED_STATE_ENABLED=${RISK_SHARED_STATE_ENABLED:-true}
      - PYTHONPATH=/app
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.toml:/app/config.toml:ro
    networks:
      - trading-network
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *service-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # React + TypeScript Frontend (replaces Dash dashboard on port 8080)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: binance-frontend
    ports:
      - "8080:80"
    networks:
      - trading-network
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Dash Dashboard service: real-time UI
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: binance-dashboard
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "python -m binance_trade_agent.scripts.preflight --service dashboard &&
      cd /app/binance_trade_agent/dashboard && python run.py"
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-trading_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-binance_trading}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-10}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-30}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - RISK_SHARED_STATE_ENABLED=${RISK_SHARED_STATE_ENABLED:-true}
      - PYTHONPATH=/app
      - REDIS_HOST=redis
      - API_HOST=api
      - API_PORT=8000
      - API_AUTH_TOKEN=${API_AUTH_TOKEN:?Set API_AUTH_TOKEN in .env}
      - DASHBOARD_USERNAME=${DASHBOARD_USERNAME:-admin}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:?Set DASHBOARD_PASSWORD in .env}
      - DASHBOARD_AUTH_ENABLED=${DASHBOARD_AUTH_ENABLED:-true}
    ports:
      - "${DASHBOARD_BIND_ADDRESS:-0.0.0.0}:${DASHBOARD_PORT:-8050}:8050"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.toml:/app/config.toml:ro
    networks:
      - trading-network
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      api:
        condition: service_started
    restart: unless-stopped
    logging: *service-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8050/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Trading Agent service: autonomous trading loop and MCP server
  trading-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: binance-trading-agent
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "python -m binance_trade_agent.scripts.preflight --service trading-agent &&
      python -m binance_trade_agent.main"
    environment:
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET:-}
      - BINANCE_API_URL=${BINANCE_API_URL:-https://testnet.binance.vision}
      - MCP_SERVER_PORT=8080
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - RISK_SHARED_STATE_ENABLED=${RISK_SHARED_STATE_ENABLED:-true}
      - PYTHONPATH=/app
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-trading_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-binance_trading}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-10}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-30}
      - TRADING_SYMBOLS=${TRADING_SYMBOLS:-BTCUSDT}
      - TRADING_INTERVAL_SECONDS=${TRADING_INTERVAL_SECONDS:-120}
      - TRADING_DURATION_MINUTES=${TRADING_DURATION_MINUTES:-0}
      - STRATEGY_NAME=${STRATEGY_NAME:-combined}
      - EXCHANGE_RECONCILE_ON_START=${EXCHANGE_RECONCILE_ON_START:-true}
      - EXCHANGE_RECONCILE_REQUIRED=${EXCHANGE_RECONCILE_REQUIRED:-true}
    ports:
      - "${MCP_BIND_ADDRESS:-127.0.0.1}:${MCP_HOST_PORT:-8081}:8080"  # MCP Server
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.toml:/app/config.toml:ro
    networks:
      - trading-network
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped
    logging: *service-logging
    # Note: MCP server uses stdio, health checks via metrics or logs

  redis:
    image: redis:7.2-alpine
    container_name: binance-redis
    expose:
      - "6379"
    restart: unless-stopped
    networks:
      - trading-network
    logging: *service-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional: Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: binance-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - trading-network
    profiles:
      - monitoring

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: binance-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - trading-network
    profiles:
      - monitoring
    depends_on:
      - prometheus

volumes:
  postgres_data:  # PostgreSQL data persistence
  prometheus_data:
  grafana_data:

networks:
  trading-network:
    driver: bridge
